notes: "Backbone of the internal build. Only P0 dataset with real navigation (INS\
  \ CSV:\nEstimatedState, Depth, Acceleration, AngularVelocity, Rpm), so the only\
  \ route to a\ngenuine L2_TRACK_RELATIVE geolocation demonstration.\n\nTwo real frequencies\
  \ make cross-frequency robustness measurable rather than asserted.\n\n5000x500 waterfall\
  \ strips tile at 512x512 / 50% overlap into ~18 windows per strip,\nwhich is what\
  \ makes USP 2 (persistence) demonstrable without depending on any\ndataset's ping\
  \ metadata. See docs/ARCHITECTURE.md section 0, item 3.\n\nWeaknesses: one class,\
  \ one site, one sensor, one mission environment. Cannot support a\nmulti-class detector\
  \ or a domain-shift claim on its own. Partially buried pipeline is a\nhard positive\
  \ \u2014 expect lower recall and report it rather than tuning it away.\n"
