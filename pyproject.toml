[project]
name = "sagardrishti"
version = "0.1.0"
description = "Aqualens data foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.0",
  "pillow>=10.0",
  "pydantic>=2.7",
  "python-multipart>=0.0.32",
  "PyYAML>=6.0",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx2>=0.1", "pytest>=8.0"]
# Deliberately optional: serving the metadata/API path does not need a multi-GB
# model runtime. Stage 3C execution installs this extra explicitly.
inference = ["torch>=2.6", "ultralytics>=8.3"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
pythonpath = ["packages", "ml"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
